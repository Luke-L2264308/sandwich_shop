name: sandwich_shop
description: "A Flutter project for a sandwich shop."
publish_to: none

version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  path: ^1.9.1
  firebase_core: ^4.3.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  sqflite_common_ffi: ^2.3.0
  build_runner: ^2.10.4
  json_serializable: ^6.11.3
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/